events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format that logs true socket remote_addr
    log_format fairdrop '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log fairdrop;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Coarse DDoS connection and request limits
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    limit_req_zone $binary_remote_addr zone=api_burst:20m rate=100r/s;

    upstream backend_api {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Enforce max connection per IP
        limit_conn addr_conn 50;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API Proxy
        location /api/ {
            limit_req zone=api_burst burst=50 nodelay;

            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CRITICAL SECURITY RULES (Spec 4.2 & Arch 4.1):
            # Overwrite X-Real-IP with socket remote_addr
            proxy_set_header X-Real-IP $remote_addr;

            # Strip/clear all untrusted forwarding and client-spoofable headers
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header X-Cluster-Client-IP "";

            proxy_set_header Host $host;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # SSE status events endpoint (disable buffering for realtime)
        location /api/events {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }
    }
}
