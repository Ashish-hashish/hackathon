services:
  nginx:
    image: nginx:alpine
    container_name: fairdrop_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fairdrop_backend:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    deploy:
      replicas: 2
    environment:
      - DATABASE_URL=postgresql://fairdrop:fairdrop_password@postgres:5432/fairdrop_db
      - REDIS_URL=redis://redis:6379/0
      - TRUSTED_PROXY_CIDR=172.16.0.0/12,127.0.0.1/32
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fairdrop_backend:latest
    command: ["python", "-m", "app.workers.main"]
    environment:
      - DATABASE_URL=postgresql://fairdrop:fairdrop_password@postgres:5432/fairdrop_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  sim-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: fairdrop_backend:latest
    command: ["python", "-m", "app.workers.sim_runner"]
    environment:
      - DATABASE_URL=postgresql://fairdrop:fairdrop_password@postgres:5432/fairdrop_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/dist_out

  redis:
    image: redis:7-alpine
    container_name: fairdrop_redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fairdrop_postgres
    environment:
      POSTGRES_USER: fairdrop
      POSTGRES_PASSWORD: fairdrop_password
      POSTGRES_DB: fairdrop_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdrop -d fairdrop_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: fairdrop_mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    restart: unless-stopped

volumes:
  pgdata:
  frontend_dist:
