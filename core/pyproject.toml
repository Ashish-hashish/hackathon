[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairdrop-core"
version = "0.1.0"
description = "Pure-function shared core for Fair Drop: canonicalization, PoW, clustering, weights, verifiable draw"
authors = [{ name = "Fair Drop Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
